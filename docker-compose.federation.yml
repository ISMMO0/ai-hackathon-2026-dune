# Federation dev harness (internal/federation.md): the Antasphere hub AND a
# Hackathon Starter CLOUD-edition instance in one compose project, pre-wired so the
# Phase 3+ SSO work has a live two-instance loop to develop against.
#
#   docker compose -f docker-compose.federation.yml up -d --build
#   curl -fsS http://localhost:3300/healthz   # hub
#   curl -fsS http://localhost:3310/healthz   # starter (cloud)
#   docker compose -f docker-compose.federation.yml down -v
#
# DEV ONLY — inline secrets, localhost-bound ports, Mailpit accepting
# unauthenticated SMTP. Never point this file at anything real.
#
# Ports (chosen to never collide with the standing local stacks — template
# :3000, Hackathon Starter self-host :3100 (+ Mailpit :8026), hub :3200 (+ :8028)):
#   3300  hub            http://localhost:3300  (Mailpit UI: http://localhost:8030)
#   3310  starter      http://localhost:3310
#
# Hostname trick: each app's PUBLIC_BASE_URL uses a *.localhost name
# (hub.ant.localhost / starter.ant.localhost) that resolves BOTH ways — browsers
# resolve *.localhost to 127.0.0.1 (RFC 6761; Chrome/Firefox do, and the
# host port mapping picks it up), while inside the compose network the same
# name is a service alias. Each app also LISTENS on its host port (PORT=3300
# / 3310), so one URL is valid from the browser and from the other
# container: the OIDC issuer string, the JWKS fetch, and the browser
# redirects all agree. From plain curl on the host, use localhost:PORT (or
# curl's --resolve, as the drill does).
#
# One PARENT domain for both apps (PRDCT-2825): `hub.ant.localhost` beside
# `starter.ant.localhost`, never `hub.localhost` beside `starter.localhost`.
# The hub's SSO hint cookie (the one the dashboard's hint-watch reads to
# notice a hub sign-out) needs a Domain both apps share; on plain
# `*.localhost` that domain is `localhost`, which browsers refuse, so the hub
# set no hint cookie and the dashboard signed a fresh session out within a
# second. Headless scripts never noticed (they carry no hint). With
# SSO_HINT_COOKIE_DOMAIN on the hub and HUB_HINT_COOKIE_DOMAIN on the tool
# both `ant.localhost`, a real browser signs into the tool through the hub
# and the session holds. Two pairs open in one browser share that cookie
# domain (cookies ignore the port): one pair per browser profile. The
# seamless overlay (docker-compose.federation.seamless.yml) established the
# name for its own silent-connect legs; the base now serves it too, so the
# overlay only adds the registry fields those legs need.
#
# One-time bootstrap after `up`:
#   1. Hub setup (operator): POST http://localhost:3300/api/v1/setup or open
#      http://hub.ant.localhost:3300 in a browser.
#   2. Hackathon Starter setup: POST http://localhost:3310/api/v1/setup or open
#      http://starter.ant.localhost:3310. It boots EDITION=cloud. There is NO
#      service key to mint: every hub read between logins presents the
#      USER's own grant (offline_access from SSO — internal/federation.md).
#
# The hub's TOOL_REGISTRY below seeds the OAuth client `tool-starter-cloud`
# at hub boot (look for "tool registry: client seeded" in `docker compose -f
# docker-compose.federation.yml logs hub`). Redirect URI + resource URL are
# the localhost twins of the production entry (internal/federation.md carries
# the real starter.antasphere.com recipe).
#
# The hub repo is a sibling checkout; override FEDERATION_HUB_DIR if your
# layout differs:
#   FEDERATION_HUB_DIR=/path/to/hub docker compose -f docker-compose.federation.yml up -d --build
#
# Every fixed value below is an env variable with today's value as its
# default, so a second copy of the harness can run beside a busy machine's
# standing stacks (PRDCT-2443). Unset, the rendering is byte-identical:
#   FEDERATION_PROJECT   compose project name       starter-federation
#   FEDERATION_HUB_PORT  hub host port = PORT       3300
#   FEDERATION_SL_PORT   Hackathon Starter host port = PORT 3310
#   FEDERATION_MAIL_PORT Mailpit UI host port       8030
#   FEDERATION_HUB_IMAGE hub image tag              antasphere-hub:federation-dev
#   FEDERATION_SL_IMAGE  Hackathon Starter image tag        starter:federation-dev
#   STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET / STRIPE_TEST_CLOCKS   the hub's Stripe sandbox (billing phase 3), empty = no provider
# (the drill overlay adds FEDERATION_HOP_PORT and FEDERATION_SUBNET_PREFIX).
# The ports are also the *.ant.localhost hostnames' ports, so PUBLIC_BASE_URL,
# HUB_ISSUER_URL and the TOOL_REGISTRY entry follow them.

name: ${FEDERATION_PROJECT:-starter-federation}

services:
  hub:
    image: ${FEDERATION_HUB_IMAGE:-antasphere-hub:federation-dev}
    build: ${FEDERATION_HUB_DIR:-../../../hub}
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      hub-db:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      default:
        aliases:
          - hub.ant.localhost
    environment:
      - PORT=${FEDERATION_HUB_PORT:-3300}
      - DATABASE_URL=postgres://antasphere:federation-dev@hub-db:5432/antasphere
      - PUBLIC_BASE_URL=http://hub.ant.localhost:${FEDERATION_HUB_PORT:-3300}
      # The SSO hint cookie's domain, shared with the tool (PRDCT-2825, above).
      - SSO_HINT_COOKIE_DOMAIN=ant.localhost
      # Phase 3 of the billing rail (hub ADR 023): the Stripe sandbox variables,
      # empty by default (the boolean false: a blank boolean is refused by the
      # hub) so the drill runs unchanged without them.
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_TEST_CLOCKS=${STRIPE_TEST_CLOCKS:-false}
      - EMAIL_DRIVER=smtp
      - SMTP_URL=smtp://mailpit:1025
      - EMAIL_FROM=Antasphere Federation Dev <dev@antasphere.local>
      - LOG_LEVEL=info
      # Seeds the Hackathon Starter cloud tool client at boot (idempotent upsert).
      # Dev twin of the production recipe in internal/federation.md.
      - 'TOOL_REGISTRY=[{"slug":"starter-cloud","name":"Hackathon Starter (federation dev)","resourceUrl":"http://starter.ant.localhost:${FEDERATION_SL_PORT:-3310}/mcp","redirectUris":["http://starter.ant.localhost:${FEDERATION_SL_PORT:-3310}/api/v1/auth/oauth2/callback/antasphere"],"clientId":"tool-starter-cloud","clientSecret":"federation-dev-client-secret-0001"}]'
    ports:
      - '127.0.0.1:${FEDERATION_HUB_PORT:-3300}:${FEDERATION_HUB_PORT:-3300}'
    read_only: true
    volumes:
      - hub_app_data:/data
    tmpfs:
      - /tmp
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:${FEDERATION_HUB_PORT:-3300}/healthz']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  hub-db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      - POSTGRES_USER=antasphere
      - POSTGRES_PASSWORD=federation-dev
      - POSTGRES_DB=antasphere
    volumes:
      - hub_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U antasphere -d antasphere']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  app:
    image: ${FEDERATION_SL_IMAGE:-starter:federation-dev}
    build: .
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      default:
        aliases:
          - starter.ant.localhost
    environment:
      - PORT=${FEDERATION_SL_PORT:-3310}
      - DATABASE_URL=postgres://app:federation-dev@db:5432/app
      - PUBLIC_BASE_URL=http://starter.ant.localhost:${FEDERATION_SL_PORT:-3310}
      # ── The cloud edition (internal/federation.md) ──────────────────────────
      - EDITION=cloud
      - HUB_ISSUER_URL=http://hub.ant.localhost:${FEDERATION_HUB_PORT:-3300}
      # The hub's hint cookie is read on this domain (PRDCT-2825, above).
      - HUB_HINT_COOKIE_DOMAIN=ant.localhost
      - HUB_CLIENT_ID=tool-starter-cloud
      - HUB_CLIENT_SECRET=federation-dev-client-secret-0001
      - EMAIL_DRIVER=smtp
      - SMTP_URL=smtp://mailpit:1025
      - EMAIL_FROM=Hackathon Starter Federation Dev <dev@starter.local>
      - LOG_LEVEL=info
    ports:
      - '127.0.0.1:${FEDERATION_SL_PORT:-3310}:${FEDERATION_SL_PORT:-3310}'
    read_only: true
    volumes:
      - app_data:/data
    tmpfs:
      - /tmp
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:${FEDERATION_SL_PORT:-3310}/healthz']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=federation-dev
      - POSTGRES_DB=app
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # One shared mail-catcher for both instances (hub signup OTP, Hackathon Starter
  # invitations). UI: http://localhost:8030
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:${FEDERATION_MAIL_PORT:-8030}:8025'
    environment:
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1

volumes:
  hub_pg_data:
  hub_app_data:
  pg_data:
  app_data:
