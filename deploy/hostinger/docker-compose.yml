# Dedicated VPS. Point DNS to the VPS first, then set STARTER_DOMAIN in hPanel.
# Guide: https://docs.antasphere.com/starter/self-hosting/hostinger
# Keep the project name and all named volumes when recreating containers.
#
# STARTER_DOMAIN is required, but NOT at render time: hPanel downloads this
# file and runs it at once with no environment, and a `${VAR:?}` refusal there
# leaves no project and no readable error ("Deployment failed", 2026-09-18).
# The file renders with an empty domain instead, and the init container refuses
# it with the instruction the customer can act on from Docker Manager.
services:
  # NO RELEASE YET. `:unreleased` is the one image reference that is allowed without a
  # digest: it says, explicitly, that this tool has published nothing. The first release
  # replaces it, here and on the app service, with `<version>@sha256:<digest>`. From then on
  # scripts/hostinger-template.test.mjs refuses anything but a digest pin, and CI rehearses
  # the published image on every run.
  init:
    image: ghcr.io/antasphere/starter:unreleased
    restart: 'no'
    environment:
      STARTER_DOMAIN: ${STARTER_DOMAIN:-}
    # The image's /data directory belongs to its non-root node user. Docker
    # copies that ownership to the empty volume on its first mount.
    volumes:
      - db_credentials:/data
    read_only: true
    network_mode: none
    command:
      - node
      - --input-type=module
      - --eval
      - |
        import { randomBytes } from 'node:crypto';
        import { existsSync, readFileSync, writeFileSync, renameSync } from 'node:fs';
        import { join } from 'node:path';
        import { isIP } from 'node:net';
        const domain = process.env.STARTER_DOMAIN || '';
        if (!domain) {
          throw new Error('STARTER_DOMAIN is not set. In Docker Manager, open this project, add the environment variable STARTER_DOMAIN with your hostname (for example starter.example.com), then redeploy.');
        }
        // Lowercase only: the same value reaches PUBLIC_BASE_URL and Caddy verbatim,
        // and browsers send lowercase Origins, so a capital letter would break the
        // app's origin comparison instead of failing here with a clear message.
        const label = /^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/;
        if (domain.length > 253 || !domain.includes('.') || isIP(domain) || !domain.split('.').every(part => label.test(part))) {
          throw new Error('STARTER_DOMAIN must be a lowercase DNS hostname, without a scheme, port or path.');
        }
        const target = join(process.argv[1], 'postgres-password');
        if (existsSync(target)) {
          if (!/^[a-f0-9]{64}\n?$/.test(readFileSync(target, 'utf8'))) {
            throw new Error('Stored database credential is invalid; restore the db_credentials volume. It will not be replaced.');
          }
        } else {
          const temporary = target + '.tmp';
          writeFileSync(temporary, randomBytes(32).toString('hex') + '\n', { mode: 0o600 });
          renameSync(temporary, target);
        }
        console.log('Database credential ready.');
      - /data

  db:
    image: pgvector/pgvector:0.8.6-pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: app
      POSTGRES_DB: app
      POSTGRES_PASSWORD_FILE: /run/starter-secrets/postgres-password
    volumes:
      - pg_data:/var/lib/postgresql/data
      - db_credentials:/run/starter-secrets:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  app:
    image: ghcr.io/antasphere/starter:unreleased
    restart: unless-stopped
    stop_grace_period: 60s
    # Rotated logs: the app logs every request, and a VPS disk is finite.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    depends_on:
      db:
        condition: service_healthy
    environment:
      PUBLIC_BASE_URL: https://${STARTER_DOMAIN:-}
      TRUST_PROXY: 'true'
      ALLOW_INSECURE_SETUP: 'false'
      AUTO_MIGRATE: 'true'
      STORAGE_DRIVER: local
      # Mail is optional: with `none` every invitation and sign-in link stays
      # copyable from the dashboard, so nothing is blocked without it. To send
      # mail instead, set EMAIL_DRIVER to brevo (the house provider), resend or
      # smtp, add the matching credential and an EMAIL_FROM whose domain is
      # verified at the provider (SPF + DKIM), then redeploy:
      #   EMAIL_DRIVER: brevo
      #   BREVO_API_KEY: <your key>
      #   EMAIL_FROM: Hackathon Starter <noreply@example.com>
      EMAIL_DRIVER: none
    # Keep the image's tini entrypoint and replace the shell with the server.
    # The generated credential is never interpolated into the Compose file.
    command:
      - sh
      - -ec
      - |
        # Read the credential on its own line: `export X="$(cmd)"` returns
        # export's status, so a failed read would boot with an empty password
        # and surface as "app unhealthy" instead of the real error.
        pw="$$(cat /run/starter-secrets/postgres-password)"
        test -n "$$pw"
        export DATABASE_URL="postgres://app:$${pw}@db:5432/app"
        exec node dist/index.js
    read_only: true
    volumes:
      - app_data:/data
      - db_credentials:/run/starter-secrets:ro
    tmpfs:
      - /tmp
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3000/readyz']
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  caddy:
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    depends_on:
      app:
        condition: service_healthy
    # Caddy's reverse-proxy command enables automatic certificates and HTTP
    # redirects. No companion Caddyfile or repository checkout is required.
    command:
      - caddy
      - reverse-proxy
      - --from
      - https://${STARTER_DOMAIN:-}
      - --to
      - http://app:3000
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_credentials:
  pg_data:
  app_data:
  caddy_data:
  caddy_config:
