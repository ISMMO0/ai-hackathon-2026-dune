name: Publish Hostinger deployment

# DISABLED IN THE TEMPLATE.
# When enabled, this workflow packages the Hostinger distribution and deploys it to GitHub Pages.
# The template publishes, deploys and dispatches nothing: the only trigger left is a manual
# run, and every job carries `if: ${{ false }}`, so a manual run does nothing either.
# A new tool re-enables it by restoring the original trigger below and removing the job guards:
#
#   on:
#     push:
#       branches: [prod]
#       paths:
#         - 'deploy/index.html'
#         - 'deploy/hostinger/**'
#         - 'scripts/hostinger-template.test.mjs'
#         - 'scripts/hostinger-smoke.mjs'
#         - '.github/workflows/hostinger-pages.yml'
#     workflow_dispatch:
on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: hostinger-pages
  cancel-in-progress: false

jobs:
  package:
    if: ${{ false }} # disabled in the template; was: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify deployment template
        run: node --test scripts/hostinger-template.test.mjs
      - name: Require anonymous access to every image
        env:
          STARTER_DOMAIN: starter.example.com
        run: |
          set -euo pipefail
          registry_config="$(mktemp -d)"
          trap 'rm -rf "$registry_config"' EXIT
          docker compose --env-file /dev/null -f deploy/hostinger/docker-compose.yml config --images | sort -u > /tmp/hostinger-images
          while IFS= read -r image; do
            docker --config "$registry_config" manifest inspect "$image" > /dev/null
          done < /tmp/hostinger-images
      - name: Rehearse installation with the exact published image
        run: node scripts/hostinger-smoke.mjs
      - uses: actions/configure-pages@v5
      # Only the distribution files are published: one folder per host under the
      # product's deploy domain (deploy.starter.antasphere.com/<host>/), plus the
      # root page that points at them. A second host is a second folder here.
      - name: Stage public files
        run: |
          mkdir -p /tmp/hostinger-pages/hostinger
          cp deploy/index.html /tmp/hostinger-pages/
          cp deploy/hostinger/docker-compose.yml deploy/hostinger/index.html /tmp/hostinger-pages/hostinger/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/hostinger-pages

  deploy:
    if: ${{ false }} # disabled in the template
    runs-on: ubuntu-latest
    needs: package
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish template and deployment button
        id: deployment
        uses: actions/deploy-pages@v4
